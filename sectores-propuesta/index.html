<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sectores | ABC Dust · Propuesta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/plataforma.css?v=1.0.23">
  <link rel="stylesheet" href="css/lista.css?v=1.0.23">
</head>
<body>
<main class="page">
  <div class="page-head">
    <nav class="crumbs" aria-label="Ruta de navegación"><span>Sectores</span></nav>
    <span class="spacer"></span>
    <div class="pill-group view-switch" id="viewSwitch" role="group" aria-label="Forma de ver los sectores">
      <button type="button" data-view="mapa" class="on" aria-pressed="true" title="Mapa con indicadores de cada sector (diseño del cliente)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Mapa</button>
      <button type="button" data-view="tabla" aria-pressed="false" title="Tabla de sectores (vista actual de la plataforma)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>Tabla</button>
    </div>
  </div>

  <!-- Buscador, filtro por sitio y Agregar: los mismos de la plataforma, para las dos vistas -->
  <section class="card toolbar" aria-label="Buscar y filtrar sectores">
    <label class="field search"><span class="sr-only">Buscar sectores</span>
      <input type="search" id="q" placeholder="Buscar sectores" autocomplete="off">
    </label>
    <label class="field site"><span>Sitio</span>
      <select id="siteSel"></select>
    </label>
    <label class="test-toggle" title="Mostrar también los sectores marcados como de prueba">
      <input type="checkbox" id="showTest" checked> Sectores de prueba
    </label>
    <a class="btn btn-primary" href="form.html" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Agregar</a>
  </section>

  <!-- ===== Vista MAPA (diseño del cliente) ===== -->
  <section class="view-map" id="viewMap">
    <div class="layout">
      <div class="left">
        <div class="map-wrap" id="mapWrap">
          <div id="map" aria-label="Mapa interactivo de los sectores"></div>
          <div class="map-msg" id="mapMsg">Cargando mapa…</div>
          <div class="map-hint">Clic en un sector para ver su información</div>
          <div class="map-layers no-print">
            <button type="button" class="layers-btn" id="layersBtn" aria-expanded="false" aria-controls="layersPanel" title="Capas">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Z"/><path d="m2 13.5 10 5.5 10-5.5"/></svg>
            </button>
            <div class="layers-panel" id="layersPanel" hidden>
              <b>Capas</b>
              <label><input type="checkbox" id="lyLabels"> Nombres de los sectores</label>
            </div>
          </div>
          <div id="hoverTip" class="hover-tip" hidden></div>
          <button type="button" class="show-list no-print" id="showList" aria-controls="sectorPanel" title="Mostrar el panel de sectores">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16M11 10l-2 2 2 2"/></svg>Mostrar sectores <span class="count" id="showListCount"></span></button>
        </div>

        <div class="legends">
          <div class="leg-row" id="effLegend" aria-label="Leyenda: color del sector según su eficiencia de supresión"></div>
        </div>

        <div class="panel" id="eventsPanel">
          <div class="panel-head">
            <h2 id="eventsTitle">Historial de eventos</h2>
            <span class="count" id="eventsCount"></span>
          </div>
          <div id="eventsBody"></div>
        </div>
      </div>

      <aside class="right" id="sectorPanel" aria-label="Lista de sectores">
        <div class="panel-head list-head">
          <h2>Todos los sectores</h2>
          <span class="count" id="sectorCount"></span>
          <button type="button" class="icon-act toggle-all" id="toggleAll" title="Expandir todas las tarjetas" aria-label="Expandir todas las tarjetas">
            <svg class="ic-exp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
            <svg class="ic-col" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg></button>
          <button type="button" class="icon-act collapse-btn" id="hideList" aria-controls="sectorPanel" aria-expanded="true" title="Ocultar el panel de sectores">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16M9 10l2 2-2 2"/></svg></button>
        </div>
        <ul class="sector-list" id="sectorList"></ul>
      </aside>
    </div>
  </section>

  <!-- ===== Vista TABLA (vista actual de la plataforma) ===== -->
  <section class="view-table card" id="viewTable" hidden>
    <div class="tbl-wrap">
      <table class="sec-table" id="secTable">
        <thead><tr>
          <th data-sort="name" class="sortable">Nombre</th>
          <th data-sort="type" class="sortable">Tipo</th>
          <th data-sort="site_name" class="sortable">Sitio</th>
          <th data-sort="length" class="sortable">Largo (m)</th>
          <th data-sort="width" class="sortable">Ancho (m)</th>
          <th data-sort="hierarchy" class="sortable">Jerarquía</th>
          <th data-sort="goal" class="sortable">Meta de supresión (%)</th>
          <th data-sort="testing" class="sortable">Es un sector de prueba</th>
          <th data-sort="created_at" class="sortable">Fecha de creación</th>
          <th data-sort="updated_at" class="sortable">Última actualización</th>
          <th><span class="sr-only">Acciones</span></th>
        </tr></thead>
        <tbody id="tblBody"></tbody>
      </table>
    </div>
    <div class="tbl-foot">
      <label>Filas por página
        <select id="rowsSel"><option>10</option><option selected>25</option><option>50</option><option value="0">Todas</option></select></label>
      <span id="pageInfo"></span>
      <button type="button" class="icon-act" id="prevPage" aria-label="Página anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
      <button type="button" class="icon-act" id="nextPage" aria-label="Página siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<script src="../maps-config.js"></script>
<script src="js/datos-stage.js?v=1.0.23"></script>
<script src="js/shared.js?v=1.0.23"></script>
<script src="js/risk.js?v=1.0.23"></script>
<script src="js/store.js?v=1.0.23"></script>
<script src="js/shell.js?v=1.0.23"></script>
<script src="js/lista.js?v=1.0.23"></script>
</body>
</html>
